name: Generate Snake Animation

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (orange on black, matches the profile)
        uses: Platane/snk@v3
        with:
          github_user_name: X-Saikat-93
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF6A1A&color_dots=%231B1B22,%234A2410,%238F3D10,%23D9540F,%23FF7A2E&sizeDotBorderRadius=3
            dist/github-contribution-grid-snake.svg?color_snake=%23E5530A&color_dots=%23EDEAE4,%23F6C9A6,%23F2A06A,%23E96F2A,%23C2410C&sizeDotBorderRadius=3

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
