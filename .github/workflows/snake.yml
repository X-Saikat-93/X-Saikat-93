name: Generate Snake Animation

on:
  schedule:
    # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (orange on black, matches the profile)
        uses: Platane/snk@v3
        with:
          github_user_name: X-Saikat-93
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=FF6A1A&color_dots=1B1B22,4A2410,8F3D10,D9540F,FF7A2E&sizeDotBorderRadius=3
            dist/github-contribution-grid-snake.svg?color_snake=E5530A&color_dots=EDEAE4,F6C9A6,F2A06A,E96F2A,C2410C&sizeDotBorderRadius=3

      # snk strips the leading '#' from custom colors; restore it so the CSS is valid
      - name: Fix color values
        run: |
          sudo chown -R "$USER" dist
          sed -i -E 's/(--c[0-4se]:)([0-9A-Fa-f]{6})([;}])/\1#\2\3/g' dist/*.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
