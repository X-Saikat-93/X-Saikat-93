<g><polygon class="l" points="78.0,273.0 190.0,329.0 190.0,359.0 78.0,303.0"/><polygon class="r" points="190.0,329.0 302.0,273.0 302.0,303.0 190.0,359.0"/><polygon class="t" points="190.0,217.0 302.0,273.0 190.0,329.0 78.0,273.0"/></g>
