<path class="ln" d="M258,220 H298 L338,144 H470" stroke-opacity=".9"/>
<circle cx="258" cy="220" r="2.5" class="ot"/>
<text x="480" y="150" class="fg" font-size="26" font-weight="600">Contracts</text>
<text x="480" y="150" class="or-t hl" style="animation-delay:0.0s" font-size="26" font-weight="600">Contracts</text>
<text x="480" y="176" class="mu" font-size="17">Validated at the edge, typed end to end.</text>
<text x="480" y="198" class="m mu" font-size="12" letter-spacing="1.5">ZOD · TYPESCRIPT · REST</text>
<path class="ln" d="M284,254 H324 L364,236 H470" stroke-opacity=".9"/>
<circle cx="284" cy="254" r="2.5" class="ot"/>
<text x="480" y="242" class="fg" font-size="26" font-weight="600">State</text>
<text x="480" y="242" class="or-t hl" style="animation-delay:1.1s" font-size="26" font-weight="600">State</text>
<text x="480" y="268" class="mu" font-size="17">Explicit state machines and idempotent writes.</text>
<text x="480" y="290" class="m mu" font-size="12" letter-spacing="1.5">LOGGED TRANSITIONS · SAFE RETRIES</text>
<path class="ln" d="M310,288 H350 L390,328 H470" stroke-opacity=".9"/>
<circle cx="310" cy="288" r="2.5" class="ot"/>
<text x="480" y="334" class="fg" font-size="26" font-weight="600">Data</text>
<text x="480" y="334" class="or-t hl" style="animation-delay:2.2s" font-size="26" font-weight="600">Data</text>
<text x="480" y="360" class="mu" font-size="17">Indexed, measured queries. Caches with fallbacks.</text>
<text x="480" y="382" class="m mu" font-size="12" letter-spacing="1.5">POSTGRESQL · REDIS · QUERY TUNING</text>
<path class="ln" d="M336,322 H376 L416,420 H470" stroke-opacity=".9"/>
<circle cx="336" cy="322" r="2.5" class="ot"/>
<text x="480" y="426" class="fg" font-size="26" font-weight="600">Security</text>
<text x="480" y="426" class="or-t hl" style="animation-delay:3.3000000000000003s" font-size="26" font-weight="600">Security</text>
<text x="480" y="452" class="mu" font-size="17">Sensitive actions gated, with an audit trail.</text>
<text x="480" y="474" class="m mu" font-size="12" letter-spacing="1.5">RBAC · 2FA · RATE LIMITS · AUDIT LOGS</text>
<path class="ln" d="M362,356 H402 L442,512 H470" stroke-opacity=".9"/>
<circle cx="362" cy="356" r="2.5" class="ot"/>
