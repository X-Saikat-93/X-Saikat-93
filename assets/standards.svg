<g><polygon class="l" points="104.0,239.0 190.0,282.0 190.0,312.0 104.0,269.0"/><polygon class="r" points="190.0,282.0 276.0,239.0 276.0,269.0 190.0,312.0"/><polygon class="t" points="190.0,196.0 276.0,239.0 190.0,282.0 104.0,239.0"/></g>
