<g class="in" style="animation-delay:0.6s"><rect x="664" y="244" width="288" height="132" rx="12" fill="#0F0F13" stroke="#25252C"/>
<text x="688" y="306" class="fg" font-size="48" font-weight="650" letter-spacing="-2">92%+</text>
<text x="688" y="338" class="mu" font-size="15" >pipeline follow-up completion</text>
<g class="bob" style="animation-delay:-5.5s"><polygon class="l" points="892.0,275.0 910.0,284.0 910.0,290.0 892.0,281.0"/><polygon class="r" points="910.0,284.0 928.0,275.0 928.0,281.0 910.0,290.0"/><polygon class="t" points="910.0,266.0 928.0,275.0 910.0,284.0 892.0,275.0"/></g></g>
</svg>