<g class="bob" style="animation-delay:-2.2s"><polygon class="l" points="892.0,127.0 910.0,136.0 910.0,142.0 892.0,133.0"/><polygon class="r" points="910.0,136.0 928.0,127.0 928.0,133.0 910.0,142.0"/><polygon class="t" points="910.0,118.0 928.0,127.0 910.0,136.0 892.0,127.0"/></g></g>
<g class="in" style="animation-delay:0.4s"><rect x="56" y="244" width="288" height="132" rx="12" fill="#0F0F13" stroke="#25252C"/>
<text x="80" y="306" class="fg" font-size="48" font-weight="650" letter-spacing="-2">~70%</text>
<text x="80" y="338" class="mu" font-size="15" >less time writing candidate</text><text x="80" y="358" class="mu" font-size="15" >notes</text>
<g class="bob" style="animation-delay:-3.3000000000000003s"><polygon class="l" points="284.0,275.0 302.0,284.0 302.0,290.0 284.0,281.0"/><polygon class="r" points="302.0,284.0 320.0,275.0 320.0,281.0 302.0,290.0"/><polygon class="t" points="302.0,266.0 320.0,275.0 302.0,284.0 284.0,275.0"/></g></g>
