<text x="384" y="158" class="fg" font-size="48" font-weight="650" letter-spacing="-2">50+</text>
<text x="384" y="190" class="mu" font-size="15" >recruiters on the in-house ATS</text>
<g class="bob" style="animation-delay:-1.1s"><polygon class="l" points="588.0,127.0 606.0,136.0 606.0,142.0 588.0,133.0"/><polygon class="r" points="606.0,136.0 624.0,127.0 624.0,133.0 606.0,142.0"/><polygon class="t" points="606.0,118.0 624.0,127.0 606.0,136.0 588.0,127.0"/></g></g>
