<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Saikat Das — full-stack software engineer">
<defs>
<pattern id="iso" width="48" height="24" patternUnits="userSpaceOnUse">
<path d="M0 12 L24 0 M24 24 L48 12 M0 12 L24 24 M24 0 L48 12" stroke="#fff" stroke-opacity=".035" fill="none"/>
</pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF6A1A" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.t{fill:#1B1B20;stroke:#2C2C34}.l{fill:#101014;stroke:#2C2C34}.r{fill:#0B0B0E;stroke:#2C2C34}
.vt{fill:#2A2A33;stroke:#43434F}.vl{fill:#17171D;stroke:#43434F}.vr{fill:#101015;stroke:#43434F}
.ot{fill:#FF6A1A}.ol{fill:#D4520C}.or{fill:#8F3406}
.fg{fill:#F4F1EC}.mu{fill:#8B8A93}.or-t{fill:#FF7A2E}
.ln{stroke:#2C2C34;fill:none}
.spine{stroke:#FF6A1A;stroke-width:1.5;fill:none;stroke-dasharray:2 8;stroke-opacity:.8;animation:flow 2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes hl{0%{opacity:0}5%{opacity:1}22%{opacity:1}30%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes drop{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}

@keyframes drop{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}
@keyframes settle{0%{transform:translateY(-70px);opacity:0}60%{transform:translateY(5px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:translateX(-420px)}100%{transform:translateX(1500px)}}
@keyframes rise2{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
@keyframes drawln{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes ping{0%{r:3;opacity:.9}100%{r:13;opacity:0}}
.settle{animation:settle 1.15s cubic-bezier(.2,.8,.2,1) backwards}
.floaty{animation:floaty 9s ease-in-out infinite}
.sweep{animation:sweep 7s cubic-bezier(.45,0,.2,1) 1.6s infinite}
.mote{animation:rise2 6s ease-out infinite}
.draw{stroke-dasharray:var(--len);animation:drawln 1.4s cubic-bezier(.65,0,.2,1) backwards}
.late{animation:fadein 1s ease-out backwards}
.ping{animation:ping 2.4s ease-out infinite}

@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-4px)}}
@keyframes ring{0%{transform:scale(.25);opacity:0}12%{opacity:.55}100%{transform:scale(2.6);opacity:0}}
@keyframes trace{to{stroke-dashoffset:var(--tl)}}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-300px);opacity:0}}
@keyframes emerge{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes speck{0%{transform:translate(0,0);opacity:0}20%{opacity:.5}100%{transform:translate(14px,-120px);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 7s cubic-bezier(.2,.6,.3,1) infinite;fill:none;stroke:#FF6A1A;stroke-width:1;vector-effect:non-scaling-stroke}
.trace{fill:none;stroke:#FF6A1A;stroke-width:2;stroke-linecap:round;animation:trace 5.5s linear infinite}
.scan{animation:scan 6s cubic-bezier(.45,0,.25,1) 2.4s infinite}
.emerge{animation:emerge 1.6s cubic-bezier(.16,.84,.24,1) .3s backwards}
.breathe{animation:breathe 4.5s ease-in-out infinite}
.nudge{animation:nudge 3s ease-in-out infinite}
.speck{animation:speck 9s ease-out infinite}
.bob{animation:bob 7s ease-in-out infinite}
.in{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.hl{opacity:0;animation:hl 6s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes wave{0%,24%,100%{transform:translateY(0)}11%{transform:translateY(-10px)}}
@keyframes flash{0%,26%,100%{opacity:0}10%{opacity:1}}
.wave{animation:wave 6s cubic-bezier(.45,0,.25,1) infinite}
.flash{opacity:0;animation:flash 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.in{opacity:1!important}}
</style>
<rect width="1000" height="540" rx="18" fill="#08080A"/><rect width="1000" height="540" rx="18" fill="url(#iso)"/><rect x=".5" y=".5" width="999" height="539" rx="17.5" fill="none" stroke="#1F1F25"/>
<defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1B22"/><stop offset="1" stop-color="#0B0B0E"/></linearGradient><linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101015"/><stop offset="1" stop-color="#050507"/></linearGradient><linearGradient id="ft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2E38"/><stop offset="1" stop-color="#17171D"/></linearGradient><linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF6A1A" stop-opacity=".16"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></linearGradient><linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A1A" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A3D" stop-opacity=".38"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></linearGradient><radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter><clipPath id="faces"><polygon points="686.0,154.0 770.0,196.0 770.0,488.0 686.0,446.0"/><polygon points="770.0,196.0 854.0,154.0 854.0,446.0 770.0,488.0"/></clipPath><clipPath id="card"><rect width="1000" height="540" rx="18"/></clipPath></defs>
<polygon class="breathe" points="720,118 820,118 960,0 580,0" fill="url(#beam)"/>
<ellipse class="pulse" cx="770" cy="446.0" rx="210" ry="48" fill="url(#glow)"/>
<g clip-path="url(#card)">
<polygon class="ring" style="animation-delay:1.0s" points="770.0,371.0 920.0,446.0 770.0,521.0 620.0,446.0"/>
<polygon class="ring" style="animation-delay:3.3s" points="770.0,371.0 920.0,446.0 770.0,521.0 620.0,446.0"/>
<polygon class="ring" style="animation-delay:5.6s" points="770.0,371.0 920.0,446.0 770.0,521.0 620.0,446.0"/>
</g>
<g class="emerge">
<polygon points="686.0,154.0 770.0,196.0 770.0,488.0 686.0,446.0" fill="url(#fl)" stroke="#fff" stroke-opacity=".07"/>
<polygon points="770.0,196.0 854.0,154.0 854.0,446.0 770.0,488.0" fill="url(#fr)" stroke="#fff" stroke-opacity=".05"/>
<polygon points="770.0,112.0 854.0,154.0 770.0,196.0 686.0,154.0" fill="url(#ft)" stroke="#fff" stroke-opacity=".12"/>
<g clip-path="url(#faces)"><rect class="scan" x="686" y="446.0" width="168" height="90" fill="url(#band)"/></g>
<path d="M770,196 V488" stroke="#FF6A1A" stroke-width="7" opacity=".5" filter="url(#gl)" class="breathe" fill="none"/>
<path d="M770,196 V488" stroke="#FF6A1A" stroke-width="1.6" opacity=".55" fill="none"/>
<path d="M770,196 V488" stroke="#FFC9A0" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="46 292" style="--tl:-338;animation:trace 4.2s cubic-bezier(.5,0,.3,1) 1.6s infinite"/>
<polygon class="trace" points="770.0,112.0 854.0,154.0 770.0,196.0 686.0,154.0" stroke-dasharray="72 303.7" style="--tl:-375.7"/>
<polygon points="770.0,112.0 854.0,154.0 770.0,196.0 686.0,154.0" fill="none" stroke="#FF6A1A" stroke-opacity=".25"/>
</g>
<circle class="speck" cx="620" cy="404" r="1.2" fill="#fff" style="animation-delay:0.0s;animation-duration:8s"/>
<circle class="speck" cx="681" cy="381" r="1.2" fill="#fff" style="animation-delay:1.3s;animation-duration:9s"/>
<circle class="speck" cx="742" cy="358" r="1.2" fill="#fff" style="animation-delay:2.6s;animation-duration:10s"/>
<circle class="speck" cx="803" cy="395" r="1.2" fill="#fff" style="animation-delay:3.9s;animation-duration:8s"/>
<circle class="speck" cx="864" cy="372" r="1.2" fill="#fff" style="animation-delay:5.2s;animation-duration:9s"/>
<circle class="speck" cx="625" cy="349" r="1.2" fill="#fff" style="animation-delay:6.5s;animation-duration:10s"/>
<circle class="speck" cx="686" cy="386" r="1.2" fill="#fff" style="animation-delay:7.8s;animation-duration:8s"/>
<rect width="1000" height="540" rx="18" fill="url(#vig)"/>
<text x="56" y="150" class="m or-t late" style="animation-delay:.3s" font-size="13" letter-spacing="5">FULL-STACK SOFTWARE ENGINEER</text>
<clipPath id="wipe"><rect x="40" y="150" width="560" height="120"><animate attributeName="width" from="0" to="560" dur="1.3s" begin=".4s" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1" fill="freeze"/></rect></clipPath>
<g clip-path="url(#wipe)"><text x="52" y="250" class="fg" font-size="96" letter-spacing="-4"><tspan font-weight="300">Saikat</tspan><tspan font-weight="700" dx="14">Das</tspan></text></g>
<path class="draw" style="--len:504;animation-delay:1s" d="M56,288 H560" stroke="#2C2C34" fill="none"/>
<path class="draw" style="--len:64;animation-delay:1s" d="M56,288 H120" stroke="#FF6A1A" stroke-width="2" fill="none"/>
<text x="56" y="334" class="mu in" style="animation-delay:1.1s" font-size="20">Backend, real-time systems and payments.</text>
<text x="56" y="364" class="mu in" style="animation-delay:1.25s" font-size="20">From database design to deployment.</text>
<path class="draw" style="--len:504;animation-delay:1.5s" d="M56,418 H560" stroke="#2C2C34" fill="none"/>
<g class="in" style="animation-delay:1.6s"><text x="56" y="448" class="m mu" font-size="10.5" letter-spacing="3">BASED IN</text><text x="56" y="474" class="fg" font-size="16">Kolkata, India</text></g>
<g class="in" style="animation-delay:1.75s"><text x="256" y="448" class="m mu" font-size="10.5" letter-spacing="3">AVAILABILITY</text><text x="256" y="474" class="fg" font-size="16">Open to remote</text></g>
</svg>