<path d="M880,210.0 V360.0" stroke="#FFC9A0" stroke-width="1.8" stroke-linecap="round" fill="none" stroke-dasharray="34 150" style="--tl:-184;animation:trace 4.6s cubic-bezier(.5,0,.3,1) 3.4000000000000004s infinite"/>
