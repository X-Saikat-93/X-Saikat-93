<path d="M700,170.0 V360.0" stroke="#FFC9A0" stroke-width="1.8" stroke-linecap="round" fill="none" stroke-dasharray="34 190" style="--tl:-224;animation:trace 4.6s cubic-bezier(.5,0,.3,1) 2.3s infinite"/>
