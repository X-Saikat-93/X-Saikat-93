<polygon points="790.0,114.0 818.0,128.0 790.0,142.0 762.0,128.0" fill="#FF6A1A" opacity=".9"/><polygon points="762.0,128.0 790.0,142.0 790.0,392.0 762.0,378.0" fill="#D4520C" opacity=".0"/>
</g>
<g class="emerge" style="animation-delay:0.48s">
